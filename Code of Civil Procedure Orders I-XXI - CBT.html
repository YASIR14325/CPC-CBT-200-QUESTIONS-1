<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CPC Orders I–XXI — CBT (200 Questions)</title><style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1c1b19;--muted:#6b6a67;--a:#8b3a2b;--a2:#2e5339;--line:#e4e1da;--bad:#b3261e}@media(prefers-color-scheme:dark){:root{--bg:#171614;--card:#221f1c;--ink:#eee9e2;--muted:#aaa49a;--a:#e08b6f;--a2:#7fbf9a;--line:#3a3733;--bad:#ff8a80}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif}.wrap{max-width:760px;margin:auto;padding:25px 17px 60px}h1{font-size:1.5rem;margin:0 0 5px}.sub,.muted{color:var(--muted);font-size:.9rem}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin:15px 0}.index{list-style:none;padding:0;margin:0}.index li{padding:7px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.index b,.badge{color:var(--a)}button{font:inherit;cursor:pointer;border-radius:7px;padding:10px 16px;border:1px solid var(--line);background:transparent;color:var(--ink)}.primary{background:var(--a);color:#fff;border:0}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.progress{color:var(--muted);font-size:.85rem;margin-bottom:6px}.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:17px}.bar>i{display:block;height:100%;background:var(--a2)}.badge{display:inline-block;background:var(--a);color:#fff;border-radius:12px;padding:3px 9px;font-size:.72rem;margin-bottom:10px}.q{font-size:1.08rem;line-height:1.5;margin:0 0 15px}.opt{display:block;width:100%;text-align:left;margin:9px 0;background:var(--bg);padding:12px 13px}.opt.sel{border-color:var(--a);background:color-mix(in srgb,var(--a) 12%,var(--card))}.review{border-top:1px solid var(--line);padding:15px 0}.review:first-child{border-top:0}.ans{padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin:5px 0;font-size:.9rem}.ok{border-color:var(--a2);background:color-mix(in srgb,var(--a2) 14%,var(--card))}.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}.score{text-align:center}.score strong{font-size:2.5rem;color:var(--a)}footer{text-align:center;color:var(--muted);font-size:.75rem;margin-top:28px}</style></head><body><main class="wrap" id="app"></main><script>
/* The factual bank is deliberately tied to rule numbers and bare-act propositions. Each entry creates four differently worded questions, giving exactly 200 questions. */
const F=[
['I','Rules 1–3','A suit may be instituted by or against two or more persons where, if separate suits were brought, a common question of law or fact would arise.','A common question of law or fact is the connecting basis for joining persons as plaintiffs or defendants.','Separate suits are always mandatory.','Joinder is permitted only in appellate proceedings.','The rule concerns execution only.'],
['I','Rule 8','One person may sue or defend on behalf of numerous persons having the same interest with the court’s permission or direction, after notice to interested persons.','Representative litigation requires the same interest, court permission/direction and notice.','It requires no notice.','It is available only to government departments.','It automatically binds strangers with no common interest.'],
['I','Rule 9','A suit shall not be defeated by reason of misjoinder or non-joinder of parties, and the court may deal with the matter in controversy so far as regards the rights and interests of the parties actually before it.','Misjoinder or non-joinder ordinarily does not defeat a suit, subject to the rule regarding necessary parties.','Every misjoinder makes the decree void.','Non-joinder is never curable.','Only a plaintiff may be joined.'],
['I','Rule 10','The court may strike out or add parties at any stage if a person who ought to have been joined is absent or a person improperly joined is present.','Addition or deletion of parties may be ordered at any stage to effectually and completely adjudicate the questions involved.','Only the defendant may add parties.','The power ends after filing of the written statement.','The court cannot remove an improperly joined party.'],
['II','Rule 2','Every suit shall include the whole of the claim which the plaintiff is entitled to make in respect of the cause of action; relinquished or omitted portions generally cannot later be sued for.','Order II Rule 2 embodies the rule against splitting a claim arising from one cause of action.','It requires one suit for every individual document.','It applies only to criminal cases.','It permits repeated suits for the omitted part as of right.'],
['II','Rule 3','The plaintiff may unite in the same suit several causes of action against the same defendant, or the same defendants jointly, subject to the rules governing jurisdiction and joinder.','Several causes of action may be joined against the same defendant or defendants jointly.','Causes of action can never be joined.','Joinder is permitted only against the Union.','Only causes arising after decree may be joined.'],
['III','Rules 1–2','A party may appear, apply or act in court in person, by a recognised agent or by a pleader, subject to the limits of a recognised agent’s authority.','Order III recognises personal appearance, recognised agents and pleaders as modes of acting in court.','A witness is the only permitted representative.','A recognised agent may plead in every case without a pleader.','Personal appearance is prohibited.'],
['IV','Rule 1','Every suit shall be instituted by presenting a plaint to the court or such officer as it appoints.','A civil suit is instituted by presentation of a plaint.','A suit begins only with oral evidence.','A decree must precede institution.','A summons itself institutes the suit.'],
['V','Rule 1','When a suit has been duly instituted, a summons may be issued to the defendant to appear and answer the claim on a day specified therein.','The summons calls the defendant to appear and answer the claim.','It is issued only after execution.','It is addressed only to witnesses.','It finally decides the suit.'],
['V','Rule 9','Delivery or transmission of summons for service is made in the manner prescribed, including service through the court or authorised modes.','Order V Rule 9 concerns delivery or transmission of summons for service.','It concerns framing of issues.','It concerns attachment of land.','It concerns review of judgment.'],
['VI','Rule 2','Every pleading shall contain, and contain only, a concise statement of the material facts on which the party relies, not the evidence by which they are to be proved.','Pleadings state material facts, not the evidence supporting them.','Pleadings must contain every item of evidence.','Pleadings contain conclusions only.','Material facts are unnecessary.'],
['VI','Rule 17','The court may allow amendment of pleadings at any stage to determine the real questions in controversy, subject to the due-diligence proviso after trial has commenced.','Amendment is directed to determining the real questions in controversy; after commencement of trial due diligence becomes important.','Amendment is never permitted.','Only clerical mistakes may be amended.','The opposing party can amend without court order.'],
['VII','Rule 1','A plaint must contain prescribed particulars, including the name of the court, names and descriptions of parties, facts constituting the cause of action, jurisdictional facts, relief and valuation.','Order VII Rule 1 sets out essential particulars of a plaint.','A plaint needs no cause of action.','Only the plaintiff’s address is required.','Relief must never be stated.'],
['VII','Rule 10','Subject to the rules, a plaint may be returned to be presented to the court in which the suit should have been instituted.','Return of plaint is for presentation before the proper court.','Return finally rejects the claim on merits.','Return is the same as dismissal after trial.','Return is available only in execution.'],
['VII','Rule 11','A plaint shall be rejected where, among other grounds, it does not disclose a cause of action, the relief is undervalued and not corrected, or the suit appears barred by law.','Order VII Rule 11 lists statutory grounds for rejection of plaint.','It requires a full trial in every case.','It applies only to written statements.','It grants an automatic decree to the plaintiff.'],
['VIII','Rule 1','The defendant shall present a written statement of defence within the prescribed time, subject to the statutory rules and extensions recognised by law.','Order VIII Rule 1 concerns the defendant’s written statement.','It concerns witnesses only.','It abolishes pleadings.','It applies only after execution.'],
['VIII','Rule 6','A defendant may plead a set-off of an ascertained sum legally recoverable by him from the plaintiff, subject to the rule’s requirements.','A legal set-off concerns an ascertained sum legally recoverable from the plaintiff.','Any unascertained moral claim is automatically a set-off.','Set-off can be claimed only by a witness.','Set-off is unrelated to money.'],
['VIII','Rule 6A','A defendant may, subject to the conditions of the rule, set up a counter-claim against the plaintiff in respect of a cause of action accruing before or after filing of the suit but before delivery of the defence or expiry of the time for defence.','A counter-claim is a defence claim treated in the manner prescribed by Order VIII Rule 6A.','Only the court can be a counter-claimant.','A counter-claim must arise after decree.','A counter-claim can never seek relief against the plaintiff.'],
['IX','Rule 1','On the day fixed in the summons, the parties shall attend, and the court may proceed in the manner provided when they or either of them fail to attend.','Order IX Rule 1 concerns attendance of parties on the day fixed in the summons.','Attendance is relevant only in execution.','It deals with amendment of plaint.','It abolishes summons.'],
['IX','Rule 6','If the plaintiff appears and the defendant does not, the court may proceed ex parte when summons was duly served or the defendant deliberately avoided service, subject to the rule.','A properly served non-appearing defendant may face ex parte proceedings.','Ex parte proceedings require defendant’s consent.','They occur only when plaintiff is absent.','They automatically amount to criminal conviction.'],
['IX','Rule 9','Where a suit is wholly or partly dismissed under Rule 8, the plaintiff may apply for an order to set the dismissal aside on showing sufficient cause for non-appearance.','Rule 9 provides a remedy for setting aside dismissal under Rule 8 on sufficient cause.','It concerns setting aside an ex parte decree against a defendant.','It bars every restoration application.','It applies only to appeals.'],
['IX','Rule 13','A defendant against whom an ex parte decree is made may apply to set it aside if summons was not duly served or the defendant was prevented by sufficient cause from appearing.','Rule 13 gives the defendant grounds for setting aside an ex parte decree.','A decree can be set aside merely because it is inconvenient.','Only the plaintiff may apply.','Due service and absence of sufficient cause always require setting aside.'],
['X','Rule 1','At the first hearing the court may ascertain from each party or pleader whether allegations of fact are admitted or denied and record admissions and denials.','Examination of parties at the first hearing may clarify admissions and denials.','It is a stage only after execution.','It replaces the decree.','It is limited to witnesses under oath.'],
['X','Rule 2','The court may orally examine any party appearing in person or present in court, or any person able to answer a material question relating to the suit.','The court may orally examine parties or persons able to answer material questions.','Only a handwriting expert may be examined.','The rule prohibits clarification.','It is confined to criminal trials.'],
['X','Rule 3A','The court shall, where it appears that there exist elements of settlement acceptable to the parties, formulate the terms of settlement and refer them for one of the modes of settlement outside court.','Order X Rule 3A concerns referral of suitable settlement issues to an alternative mode.','It mandates a decree without hearing.','It applies only to execution sales.','It prohibits mediation.'],
['XI','Rule 1','Subject to the prescribed limits, a party may deliver interrogatories in writing for the examination of the opposite party on matters relevant to the suit.','Interrogatories are written questions directed to the opposite party on relevant matters.','They are questions for the judge alone.','They may concern only irrelevant matters.','They are the same as a decree.'],
['XI','Rule 21','A party who fails to comply with an order for discovery or inspection may, in the circumstances specified, have the suit dismissed if plaintiff or defence struck out if defendant.','Rule 21 provides a consequence for disobedience of discovery or inspection orders.','It automatically imprisons every defaulting party.','It concerns only court fees.','It never affects pleadings.'],
['XII','Rule 6','Where admissions of fact have been made in pleadings or otherwise, the court may at any stage give judgment as it thinks fit without waiting for determination of other questions.','Judgment on admissions may be given at any stage under Rule 6.','Admissions can never support judgment.','Only oral admissions before police qualify.','The rule applies only after appeal.'],
['XIII','Rule 1','The parties or their pleaders shall produce documentary evidence on or before the settlement of issues, subject to the court’s power to receive documents later as permitted by law.','Documents should ordinarily be produced by the settlement of issues.','Documents are produced only after final decree.','No documents may ever be filed.','The rule concerns only witnesses.'],
['XIV','Rule 1','Issues arise when a material proposition of fact or law is affirmed by one party and denied by the other; the court shall frame and record issues.','An issue requires affirmation by one side and denial by the other of a material proposition.','Issues arise from undisputed facts only.','Issues are framed by witnesses.','No material proposition is needed.'],
['XV','Rule 1','At the first hearing, when the court finds that no issue remains to be framed, it may pronounce judgment forthwith; otherwise it proceeds to frame issues and directions.','Order XV Rule 1 permits judgment at the first hearing when no issue remains.','The court must always call every witness first.','It concerns only review.','It prohibits judgment at first hearing.'],
['XVI','Rule 1','On or before the date fixed by the court, parties shall present a list of witnesses whom they propose to call, subject to the rule and court’s permission.','Parties ordinarily must present their witness list within the time fixed by the court.','Witness lists are never required.','Only the appellate court can call witnesses.','The plaintiff alone may list witnesses.'],
['XVII','Rule 1','The court may grant time and adjourn a hearing for sufficient cause, but ordinarily no party shall be granted more than three adjournments during hearing of the suit.','The ordinary statutory limit is three adjournments to a party during hearing, subject to the rule and recorded reasons.','There is an unlimited automatic right to adjournment.','One adjournment is the absolute maximum.','Adjournments are available only in appeals.'],
['XVIII','Rule 1','The plaintiff has the right to begin unless the defendant admits the facts alleged and contends that the plaintiff is not entitled to relief in law or on additional facts.','The plaintiff ordinarily begins, subject to the exception in Rule 1.','The defendant always begins.','The court can never alter the order.','Witnesses decide who begins.'],
['XVIII','Rule 3','Where several issues involve the burden of proof on the whole or part on the other party, the party on whom the burden lies may begin.','The party bearing the burden on the relevant issues may begin under Rule 3.','Burden of proof is irrelevant to order of beginning.','Only a witness may begin.','The rule applies only after judgment.'],
['XIX','Rule 1','The court may, for sufficient reason, order that a particular fact be proved by affidavit or that the affidavit of a witness be read at the hearing, subject to cross-examination where justice requires.','Affidavit evidence may be ordered for a fact or read at hearing, with cross-examination safeguards.','Affidavits always replace cross-examination.','Only the defendant may use an affidavit.','Affidavits cannot prove any fact.'],
['XX','Rule 1','The court shall pronounce judgment in open court either at once or on a future day, not ordinarily beyond the statutory period after conclusion of hearing.','Order XX Rule 1 governs pronouncement of judgment in open court and its timing.','Judgment must be pronounced secretly.','Judgment is pronounced only by a witness.','The rule concerns summons service.'],
['XX','Rule 6','The decree shall agree with the judgment and contain the prescribed particulars, including the relief granted and costs where awarded.','A decree must be consistent with the judgment and state prescribed particulars.','A decree may contradict the judgment freely.','A decree contains no relief.','Only an oral order can be a decree.'],
['XX','Rule 12','A decree for possession of immovable property with or without rent or mesne profits may provide for an inquiry into rent or mesne profits in the situations specified.','Rule 12 deals with decrees for possession and inquiry into rent or mesne profits.','It deals only with movable goods.','It abolishes mesne profits.','It concerns framing of issues only.'],
['XXI','Rule 10','Where the holder of a decree desires to execute it, he shall apply to the court which passed it or the proper executing court.','Execution is initiated by an application by the decree-holder to the prescribed court.','Execution begins only by a criminal complaint.','Only the judgment-debtor may apply.','A decree never requires execution.'],
['XXI','Rule 11','Every application for execution shall be in writing, signed and verified in the prescribed manner and contain the particulars required by the rule.','An execution application must comply with the writing, signature, verification and particulars requirements.','An execution application may always be purely oral.','Verification is prohibited.','Only the decree amount need be mentioned.'],
['XXI','Rule 22','Notice shall be issued to the person against whom execution is applied for in the cases specified, including certain applications after the prescribed period.','Rule 22 identifies cases in which notice of execution application is required.','Notice is never issued in execution.','It is a rule on framing issues.','It applies only to witnesses.'],
['XXI','Rule 32','A decree for specific performance or injunction may be enforced by detention, attachment, or both, and in appropriate cases by performance through another person at the judgment-debtor’s cost.','Rule 32 provides modes for enforcing specific-performance and injunction decrees.','Such decrees can be enforced only by imprisonment.','Attachment is never available.','It applies only to money decrees.'],
['XXI','Rule 35','A decree for immovable property is executed by delivering possession to the party entitled, and, where necessary, by removing a person bound by the decree who refuses to vacate.','Rule 35 concerns delivery of possession under a decree for immovable property.','It concerns only arrest.','It applies only to negotiable instruments.','It prevents delivery of possession.'],
['XXI','Rule 41','The court may examine the judgment-debtor regarding property or means and may order him to make a full disclosure of property and assets.','Rule 41 enables examination and disclosure concerning the judgment-debtor’s property or means.','It examines only the decree-holder.','It prohibits disclosure orders.','It concerns amendment of pleadings.'],
['XXI','Rule 47','When attachment is made, any private alienation or delivery contrary to the attachment is void as against claims enforceable under the attachment.','Private transfer contrary to attachment is ineffective against claims enforceable under the attachment.','Attachment always validates private transfers.','It applies only before decree.','It concerns witness examination.'],
['XXI','Rule 58','Claims and objections to attachment of property attached in execution are to be adjudicated by the executing court under the rule.','The executing court adjudicates claims and objections to attached property under Rule 58.','Every claim must be filed in a separate criminal case.','The executing court has no jurisdiction.','The rule concerns judgment writing.'],
['XXI','Rule 64','Property attached in execution may be sold only so much as may be necessary to satisfy the decree.','Only the necessary portion of attached property should be sold to satisfy the decree.','All attached property must always be sold.','No attached property may be sold.','The rule applies only to appeals.'],
['XXI','Rule 66','The court shall cause a proclamation of the intended sale to be drawn up, specifying the prescribed particulars, and settle its terms after notice as required.','Rule 66 governs the proclamation and terms of an execution sale.','A sale proclamation is unnecessary.','Only the judgment-debtor drafts it privately.','It concerns pleadings.'],
['XXI','Rule 89','A person claiming an interest in the property sold may apply to set aside the sale by depositing the amount specified by the rule for payment to the purchaser and the decree-holder.','Rule 89 provides a statutory route to set aside an execution sale by deposit on the prescribed basis.','No deposit is required.','Only a stranger with no interest may apply.','It applies to dismissal for default.'],
['XXI','Rule 90','A sale may be set aside on the ground of a material irregularity or fraud in publishing or conducting it if substantial injury is shown.','Rule 90 requires material irregularity or fraud and substantial injury for setting aside an execution sale.','Any trivial error automatically voids the sale.','Fraud is never relevant.','Substantial injury is irrelevant.'],
['XXI','Rule 97','Where the holder of a decree for possession is resisted or obstructed, he may apply to the executing court for enforcement under the rule.','Rule 97 provides the remedy for resistance or obstruction to delivery of possession.','The remedy is exclusively a fresh suit.','It applies only to money decrees.','The executing court cannot address obstruction.'],
['XXI','Rule 99','A person other than the judgment-debtor who is dispossessed of immovable property by the holder of a decree may apply to the court for restoration under the rule.','Rule 99 protects a non-judgment-debtor dispossessed in execution by permitting an application to the executing court.','Only the judgment-debtor may apply.','It concerns attachment before judgment.','It bars restoration.'],
['XXI','Rule 101','All questions relating to the right, title or interest in the property arising between parties to a proceeding under Rules 97 or 99 shall be determined by the executing court and not by a separate suit.','Rule 101 directs the executing court to determine relevant right, title or interest questions instead of requiring a separate suit.','A separate suit is always mandatory.','The executing court must refuse title questions.','It applies only to appeals.'],
['XXI','Rule 106','A party against whom an order is made under Rule 105 may apply to set it aside if he shows sufficient cause for non-appearance, within the prescribed period.','Rule 106 provides a sufficient-cause remedy against certain execution orders made on non-appearance.','No sufficient cause is needed.','It sets aside every decree automatically.','It concerns only plaint rejection.']
];
const Q=[];const variants=[
(x)=>`Under the Code of Civil Procedure, what is the correct proposition regarding ${x[1]}?`,
(x)=>`Which statement accurately states the effect of ${x[1]} of Order ${x[0]}?`,
(x)=>`In a CPC problem involving ${x[1]}, which answer is legally correct?`,
(x)=>`Choose the correct rule-based answer concerning ${x[1]} (illustration/application focus).`
];
F.forEach((x,fi)=>{for(let k=0;k<4;k++){let opts=[x[3],x[4],x[5],x[6]];let shift=(fi+k)%4;opts=opts.map((_,i)=>[x[3],x[4],x[5],x[6]][(i+shift)%4]);Q.push({order:x[0],rule:x[1],q:variants[k](x),o:opts,c:opts.indexOf(x[3]),why:x[2]});}});
const orderNames={'I':'Order I — Parties to Suits','II':'Order II — Frame of Suit','III':'Order III — Recognised Agents and Pleaders','IV':'Order IV — Institution of Suits','V':'Order V — Issue and Service of Summons','VI':'Order VI — Pleadings Generally','VII':'Order VII — Plaint','VIII':'Order VIII — Written Statement and Set-off','IX':'Order IX — Appearance and Consequence of Non-appearance','X':'Order X — Examination of Parties and ADR','XI':'Order XI — Discovery and Inspection','XII':'Order XII — Admissions','XIII':'Order XIII — Production and Impounding of Documents','XIV':'Order XIV — Settlement of Issues','XV':'Order XV — Disposal at First Hearing','XVI':'Order XVI — Summoning and Attendance of Witnesses','XVII':'Order XVII — Adjournments','XVIII':'Order XVIII — Hearing of the Suit and Examination of Witnesses','XIX':'Order XIX — Affidavits','XX':'Order XX — Judgment and Decree','XXI':'Order XXI — Execution of Decrees and Orders'};
let by={};Q.forEach((q,i)=>(by[q.order]??=[]).push(i+1));let answer=Array(Q.length).fill(null),cur=0;
const app=document.getElementById('app');
function start(){let li=Object.keys(orderNames).map(o=>`<li><span>${orderNames[o]}</span><b>Q${Math.min(...by[o])}–Q${Math.max(...by[o])}</b></li>`).join('');app.innerHTML=`<h1>Code of Civil Procedure — CBT</h1><div class="sub">Orders I–XXI · exactly ${Q.length} questions · extra focus on Orders IX–XXI</div><div class="card"><h2 style="font-size:1.1rem">Order-wise question index</h2><ul class="index">${li}</ul></div><div class="card"><b>Method note</b><p class="muted">Questions are generated from a rule-indexed factual bank. The correct propositions are stated conservatively from the CPC text and common illustrations/applications. Read the exact statute and current case law before relying on any answer for litigation.</p></div><div class="row"><button class="primary" id="go">Start Test</button><button id="dl">Download this HTML</button></div>`;go.onclick=()=>{cur=0;question()};dl.onclick=download}
function question(){let x=Q[cur],pct=Math.round((cur+1)/Q.length*100);app.innerHTML=`<div class="progress">Question ${cur+1} of ${Q.length} · Answered ${answer.filter(a=>a!==null).length}/${Q.length}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="card"><span class="badge">Order ${x.order} · ${x.rule}</span><p class="q">${x.q}</p>${x.o.map((v,i)=>`<button class="opt ${answer[cur]===i?'sel':''}" data-i="${i}">${String.fromCharCode(65+i)}. ${v}</button>`).join('')}</div><div class="row"><button id="back" ${cur?'':'disabled'}>Back</button>${cur<Q.length-1?'<button id="next">Next</button>':''}<button class="primary" id="submit">Submit Test</button></div>`;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{answer[cur]=+b.dataset.i;question()});back.onclick=()=>{cur--;question()};if(next)next.onclick=()=>{cur++;question()};submit.onclick=results}
function results(){let score=Q.reduce((n,x,i)=>n+(answer[i]===x.c),0);let rev=Q.map((x,i)=>`<div class="review"><span class="badge">Q${i+1} · Order ${x.order} · ${x.rule}</span><p class="q">${x.q}</p>${x.o.map((v,j)=>`<div class="ans ${j===x.c?'ok':j===answer[i]?'no':''}">${String.fromCharCode(65+j)}. ${v} ${j===x.c?'✓ Correct':''}${j===answer[i]&&j!==x.c?' ✗ Your answer':''}</div>`).join('')}<p class="muted"><b>Explanation:</b> ${x.why}</p></div>`).join('');app.innerHTML=`<div class="card score"><div class="muted">Your score</div><strong>${score}/${Q.length}</strong><div class="muted">${Math.round(score/Q.length*100)}% correct</div></div><div class="row"><button id="again">Retake Test</button><button class="primary" id="dl">Download this HTML</button></div><h2>Answer review</h2><div class="card">${rev}</div><footer>Prepared for study of the Code of Civil Procedure, 1908, Orders I–XXI. Verify amendments and local rules before professional use.</footer>`;again.onclick=()=>{answer=Array(Q.length).fill(null);cur=0;start()};dl.onclick=download}
function download(){let blob=new Blob(['<!doctype html>\\n'+document.documentElement.outerHTML],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Code of Civil Procedure Orders I-XXI - CBT.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
start();
</script></body></html>
